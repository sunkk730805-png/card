<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부찌대학 대표 이범례 | 모바일 명함</title>
<meta name="description" content="고려대 정문 앞 부대찌개 전문점 · 소문난의정부부대찌개 고대본점 / 부찌대학">
<meta property="og:type" content="website">
<meta property="og:title" content="부찌대학 대표 이범례">
<meta property="og:description" content="고려대 정문 앞 부대찌개 전문점 · since 2013">
<meta property="og:image" content="https://card.buzzi.kr/og.png">
<meta property="og:url" content="https://card.buzzi.kr/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8DC; --sand:#FBEBB5; --line:#EFD88E;
    --ink:#4A1F1C; --brand:#74332E; --deep:#5A2520; --muted:#93784A; --tiger:#F4C95D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#F1DC9A}
  body{
    font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; min-height:100vh;
  }
  main{width:100%; max-width:440px; background:var(--cream); padding:44px 22px 0}
  a{color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent}

  /* 머리 */
  .head{text-align:center}
  .me{width:164px; height:164px; border-radius:50%; object-fit:cover; border:5px solid var(--tiger); background:#fff; display:block; margin:0 auto}
  .logo{width:104px; height:auto; display:block; margin:24px auto 0}
  .since{margin-top:14px; font-size:12px; letter-spacing:.34em; color:var(--muted); font-weight:500}
  h1{margin-top:20px; font-size:40px; font-weight:500; letter-spacing:.04em; line-height:1.15}
  .role{margin-top:8px; font-size:16px; font-weight:700; color:var(--brand); letter-spacing:.02em}
  .what{
    display:inline-block; margin-top:20px; padding:9px 18px; border-radius:999px;
    background:var(--sand); font-size:15.5px; font-weight:700; letter-spacing:-.01em;
  }
  .slogan{margin-top:12px; font-size:13.5px; color:var(--muted)}

  /* 버튼 공통 */
  .save{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:28px; height:60px; border-radius:20px;
    background:var(--tiger); color:#2A1512; font-size:17.5px; font-weight:800;
  }
  .save.call{margin-top:10px; background:var(--brand); color:#fff; font-weight:700; letter-spacing:.02em}
  .save{position:relative}
  .save:not(.call){animation:press 3.2s ease-in-out infinite}
  .tap{position:absolute; right:22px; bottom:-14px; width:34px !important; height:34px !important;
    color:#2A1512; fill:#fff; filter:drop-shadow(0 2px 2px rgba(74,31,28,.25));
    animation:tap 3.2s ease-in-out infinite; pointer-events:none}
  @keyframes tap{0%,36%,100%{transform:translate(0,0)} 8%,24%{transform:translate(-5px,-9px)} 16%{transform:translate(0,0)} 30%{transform:translate(0,0)}}
  @keyframes press{0%,6%,20%,36%,100%{transform:scale(1)} 10%,26%{transform:scale(.975)}}
  @media (prefers-reduced-motion:reduce){.tap,.save:not(.call){animation:none}}
  .save svg{width:22px; height:22px}
  .row{
    display:flex; align-items:center; gap:14px;
    padding:15px 16px; border-radius:20px; margin-top:10px;
    background:var(--sand); border:1px solid var(--line);
  }
  .row.dark{background:var(--brand); border-color:var(--brand); color:#fff}
  .ico{
    flex:none; width:40px; height:40px; border-radius:50%;
    display:grid; place-items:center; background:#fff; color:var(--brand);
  }
  .dark .ico{background:rgba(255,255,255,.2); color:#fff}
  .ico svg{width:20px; height:20px}
  .txt{min-width:0}
  .lab{font-size:12.5px; color:var(--muted)}
  .dark .lab{color:rgba(255,255,255,.75)}
  .val{font-size:17px; font-weight:700; margin-top:1px; word-break:keep-all}
  .sub{font-size:12.5px; color:var(--muted); margin-top:2px}

  /* 매장 */
  h2{margin:30px 4px 2px; font-size:12.5px; font-weight:700; letter-spacing:.22em; color:var(--muted)}
  .store{
    margin-top:10px; padding:18px 16px 16px; border-radius:20px;
    background:#fff; border:1px solid var(--line);
  }
  .store .name{font-size:17.5px; font-weight:800; letter-spacing:-.01em}
  .tag{
    display:inline-block; margin-top:7px; padding:3px 10px; border-radius:999px;
    font-size:12px; font-weight:700; background:var(--sand); color:var(--brand);
  }
  .tag.solid{background:var(--brand); color:#fff}
  .addr{margin-top:9px; font-size:14px; color:#6E4A42}
  .acts{display:grid; grid-template-columns:1.25fr 1fr; gap:8px; margin-top:14px}
  .act{
    display:flex; align-items:center; justify-content:center; gap:7px;
    height:48px; border-radius:14px; font-size:15px; font-weight:700;
    background:var(--brand); color:#fff;
  }
  .act.ghost{background:var(--sand); color:var(--ink); border:1px solid var(--line)}
  .act svg{width:17px; height:17px}

  footer{
    margin:34px -22px 0; padding:20px 22px; text-align:center;
    background:var(--brand); color:rgba(255,255,255,.9); font-size:12.5px; letter-spacing:.06em;
  }
  a:active{opacity:.82}

</style>
</head>
